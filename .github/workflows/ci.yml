name: PET Circular - testes Python

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'development/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }} / unittest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar sintaxe Python
        run: python -m compileall -q app.py pet_circular document_ai.py ui_document_ai.py ui_helpers.py storage.py tests

      - name: Testes automatizados (sem API externa)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
          OPENAI_API_KEY: ''
        run: python -m unittest discover -s tests -p 'test_*.py' -v
